# 물류창고 MQTT 브로커 (Mosquitto 2.x) — Mac mini M4 에서 실행
#   brew install mosquitto
#   ./setup_mac.sh            (비밀번호 파일 만들고 이 설정으로 실행)
# 경로는 setup_mac.sh 가 이 파일 위치 기준으로 바꿔 넣는다 (__DIR__).

# ── 접속 ─────────────────────────────────────────────────────────────
# 장비·노트북·관제 PC 가 같은 공유기(LAN) 에 있다고 가정. 외부(인터넷)로 열지 않는다.
listener 1883 0.0.0.0
protocol mqtt

# 웹 대시보드(브라우저, MQTT over WebSocket) 용
listener 9001 0.0.0.0
protocol websockets

# ── 인증·권한 ─────────────────────────────────────────────────────────
# 사용자명 = 역할 (unity, scheduler, rl, control, sensor, monitor, admin)
allow_anonymous false
password_file __DIR__/passwd
acl_file __DIR__/acl
per_listener_settings false

# ── 세션·저장 ────────────────────────────────────────────────────────
# retain 상태와 영구 세션(scheduler, control)의 미전달 QoS1 메시지를 재시작 후에도 유지
persistence true
persistence_location __DIR__/data/
autosave_interval 30
# 영구 세션이 하루 넘게 안 붙으면 정리
persistent_client_expiration 1d
# 클라이언트별 대기열: pose(QoS 0)는 밀리면 버리고, QoS 1 은 최대 1000개까지 보관
max_queued_messages 1000
max_inflight_messages 50
queue_qos0_messages false
# 패킷 최대 256 KB (스냅샷 1980 레인 ≈ 80 KB 여유)
max_packet_size 262144
max_keepalive 60

# ── 로그 ─────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
# $SYS/broker/... 통계를 10초마다 (대시보드용)
sys_interval 10
