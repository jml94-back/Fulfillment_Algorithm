# ML-Agents 학습 설정 초안 — RTX 4060 노트북(VRAM 8 GB), 헤드리스 Unity 빌드 병렬
#   mlagents-learn rl/unity/amr_poca_4060.yaml --run-id amr_poca_d4
#
# 전제 (rl/README.md 3~6장)
# - Behavior 이름 "AMR", AMR 4대가 같은 Behavior 를 공유(파라미터 공유). 4대를 SimpleMultiAgentGroup 하나로 묶는다.
# - 관측: Lidar2DSensor 72빔 x 2프레임 스택 + 벡터 27 (경유점 2개, 속도·무게, 직전 행동, 이웃 AMR 3대)
# - 행동: 연속 2 (목표 v, w). DecisionRequester 주기 = 0.1 s (Academy 고정 스텝 0.02 s x DecisionPeriod 5)
# - 에피소드 = 경로 구간 1개 (도착 +10 → EndEpisode, 충돌 -30 → EndEpisode). 그룹 보상은 처리량 보너스만.
# 숫자는 Python 프로토타입(rl/mappo.py)에서 확인한 값에서 출발한 초기값이고, Unity 에서 다시 맞춰야 한다.

behaviors:
  AMR:
    trainer_type: poca            # MA-POCA: 중앙 critic + 에이전트별 기여 추정. 대안은 아래 ppo 블록 참고
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960          # = 20 x batch. 6 env x 4 AMR x time_horizon 128 ≈ 3,072 스텝/수집 → 13회 수집마다 갱신
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-3                # 엔트로피 (프로토타입 0.001)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true             # 벡터 관측 정규화 (LiDAR 는 센서에서 이미 0~1)
      hidden_units: 256
      num_layers: 2
      # 3D LiDAR 높이 격자(2.5D) 를 시각 관측으로 쓸 때만 의미 있음. 2D 만 쓰면 무시된다.
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 128
    max_steps: 3.0e7              # 에이전트 결정 수 기준. 프로토타입은 2.5e7 로도 부족했다 (README 8장)
    keep_checkpoints: 10
    checkpoint_interval: 500000
    summary_freq: 20000

env_settings:
  env_path: Builds/WarehouseHeadless/Warehouse.x86_64   # Linux 헤드리스 빌드. Windows 면 Warehouse.exe
  num_envs: 6                     # CPU 코어(물리) - 2 정도. 8코어 노트북 기준 6. 환경 시뮬이 병목이다
  base_port: 5005
  seed: 0
  num_areas: 1                    # 빌드 안에 창고를 여러 개 복제할 거면 2~4 (한 프로세스에서 병렬)

engine_settings:
  no_graphics: true               # 레이캐스트 LiDAR 는 렌더링 없이 동작. 카메라 센서를 쓰면 false 로
  time_scale: 20
  target_frame_rate: -1
  quality_level: 0
  width: 84
  height: 84
  capture_frame_rate: 60

torch_settings:
  # MLP 256x2 정도면 CPU 와 GPU 속도 차가 작다(병목은 Unity). 3D LiDAR 높이 격자(CNN)를 넣으면 cuda 가 확실히 이득.
  device: cuda

checkpoint_settings:
  run_id: amr_poca_d4
  initialize_from: null           # 단계 0~1 을 혼자 학습한 run 에서 이어가려면 그 run-id
  resume: false
  force: false

# 커리큘럼: Unity 쪽에서 Academy.Instance.EnvironmentParameters.GetWithDefault("stage", 0) 로 읽는다.
# measure: reward 는 Behavior 의 평균 에피소드 보상(= 경로 구간 1개).
# 도착 +10, 충돌 -30 이라 대략 성공률 85~90% ≈ 평균 6~8. 프로토타입 기준(rl/mappo.py --cur-success 0.85)에 맞춘 초기값이다.
environment_parameters:
  stage:
    curriculum:
      - name: S0_혼자_근거리목표
        completion_criteria: {measure: reward, behavior: AMR, signal_smoothing: true, min_lesson_length: 200, threshold: 7.0}
        value: 0.0
      - name: S1_혼자_실제임무
        completion_criteria: {measure: reward, behavior: AMR, signal_smoothing: true, min_lesson_length: 300, threshold: 8.0}
        value: 1.0
      - name: S2_4대
        completion_criteria: {measure: reward, behavior: AMR, signal_smoothing: true, min_lesson_length: 500, threshold: 7.0}
        value: 2.0
      - name: S3_4대_작업자2
        completion_criteria: {measure: reward, behavior: AMR, signal_smoothing: true, min_lesson_length: 500, threshold: 6.5}
        value: 3.0
      - name: S4_4대_작업자4_임시팔레트
        value: 4.0
  # ML-Agents 커리큘럼에는 "N 스텝 지나면 강제로 다음 단계"가 없다. 프로토타입처럼 기준을 못 넘고 멈추면
  # threshold 를 낮추거나 initialize_from 으로 이어서 단계 값을 직접 올린다.
  # 도메인 무작위화 (sim-to-real). 단계와 별도로 항상 적용
  lidar_noise_std: {sampler_type: uniform, sampler_parameters: {min_value: 0.0, max_value: 0.03}}   # m
  lidar_dropout: {sampler_type: uniform, sampler_parameters: {min_value: 0.0, max_value: 0.05}}     # 빔 비율
  action_delay_steps: {sampler_type: uniform, sampler_parameters: {min_value: 0, max_value: 2}}     # 0~0.2 s
  payload_kg: {sampler_type: uniform, sampler_parameters: {min_value: 200, max_value: 1500}}
  floor_friction: {sampler_type: uniform, sampler_parameters: {min_value: 0.6, max_value: 1.0}}

# ---------------------------------------------------------------------------------------------
# 대안: 공유 파라미터 PPO (= IPPO). 그룹을 만들지 않고 behaviors.AMR.trainer_type 만 ppo 로 바꾸면 된다.
# critic 이 다른 AMR 정보를 못 보므로 4대 혼잡 단계에서 학습이 느릴 수 있다 (README 5장).
#
# 대안: 직접 만든 MAPPO (rl/mappo.py) 로 Unity 를 학습하려면 mlagents-learn 대신
#   from mlagents_envs.environment import UnityEnvironment
#   from mlagents_envs.envs.unity_parallel_env import UnityParallelEnv   # PettingZoo ParallelEnv
# 로 빌드를 감싸 rl/amr_env.ParallelAMREnv 자리에 넣는다 (관측·행동 형식이 같게 설계됨).
